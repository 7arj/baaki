[project]
name = "baaki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=1.2.0",
    "clerk-backend-api>=7.0.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "razorpay>=2.0.1",
    "rich>=15.0.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
baaki = "baaki.__main__:main"
