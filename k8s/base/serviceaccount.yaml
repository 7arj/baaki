# The app never talks to the Kubernetes API, so its identity gets no permissions and no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baaki
automountServiceAccountToken: false
---
# Least-privilege human access: a developer can look at the app and its logs, but cannot read
# Secrets, exec into pods, or change anything.
#   kubectl auth can-i get pods --as=system:serviceaccount:baaki:developer -n baaki      -> yes
#   kubectl auth can-i get secrets --as=system:serviceaccount:baaki:developer -n baaki   -> no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-only
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-read-only
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: baaki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-only
