# Schema migrations run once per deploy, before the new web pods, instead of inside every pod.
# Argo CD runs this as a Sync hook in wave 1: after Postgres (wave 0) is healthy, before the web
# Deployment (wave 2). BeforeHookCreation deletes the previous run so each sync starts fresh.
apiVersion: batch/v1
kind: Job
metadata:
  name: baaki-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baaki-migrate
    spec:
      serviceAccountName: baaki
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: baaki
          command: ["python", "-m", "baaki", "migrate"]
          envFrom:
            - configMapRef: {name: baaki-config}
            - secretRef: {name: baaki-secrets}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
