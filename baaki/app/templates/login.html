{% extends "base.html" %}{% block title %}Sign in to Baaki{% endblock %}
{% block body %}
<div class="auth">
  <a class="brand" href="/" style="justify-content:center;margin-bottom:18px"><span class="dot"></span>Baaki</a>
  <div class="card">
    <h1>Sign in</h1>
    <p class="muted small" style="margin-bottom:20px">Welcome back.</p>
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autofocus></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required></div>
      <button class="btn primary lg" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>
    <div class="alt">New here? <a href="/signup">Create an account</a> · <a href="/forgot">Forgot password?</a></div>
  </div>
</div>
{% endblock %}
